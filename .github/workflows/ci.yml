name: Backend CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Test & Package (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run unit tests
        run: ./mvnw -B test -Dtest='!*IntegrationTest'

      - name: Run Testcontainers integration tests
        env:
          RUN_INTEGRATION_TESTS: 'true'
        run: ./mvnw -B test -Dtest='*IntegrationTest'

      - name: Package application
        run: ./mvnw -B package -DskipTests

      - name: Prepare deployable WAR
        shell: bash
        run: |
          set -Eeuo pipefail
          war_path="$(find target -maxdepth 1 -type f -name '*.war' -print -quit)"
          test -n "$war_path"
          cp "$war_path" stock-dashboard.war
          test -s stock-dashboard.war

      - name: Upload deployable WAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-war-${{ github.sha }}
          path: stock-dashboard.war
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-${{ github.sha }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
